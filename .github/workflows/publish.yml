name: Publish

"on":
  workflow_dispatch:

# Publishes every language's JVM jar and per-platform JNI artifacts to Maven
# Central. Each publication is produced by exactly one runner, and each
# runner publishes only the JNI artifacts of its own platform:
#
#   macos-14      -> all languages' -kmp-jvm jars (once) +
#                    -kmp-jni-darwin-aarch64 (native) and
#                    -kmp-jni-darwin-x86_64 (cross-compiled with
#                    -Pjni.os=macos -Pjni.arch=x64)
#   ubuntu-latest -> -kmp-jni-linux-x86_64 (native) and
#                    -kmp-jni-linux-aarch64 (cross-compiled with
#                    -Pjni.os=linux -Pjni.arch=aarch64)
#   windows-latest -> -kmp-jni-windows-x86_64 (native MinGW/CMake build)
#
# The jvm POM of each language lists all five JNI artifacts as runtime
# dependencies, so all of them must be published before consumers can resolve
# the language artifact.
#
# Trigger: run manually via the Actions tab. Versions are the grammar tags
# of each language plus a .1 release suffix (e.g. tree-sitter-java v0.23.5
# -> 0.23.5.1), resolved from the submodules at build time.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MAVEN_CENTRAL_USERNAME   Sonatype Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD   Sonatype Central Portal user-token password
#   SIGNING_KEY              base64-encoded PGP secret key ring (.gpg, binary)
#   SIGNING_KEY_ID           8-hex-digit key id (without the 0x prefix)
#   SIGNING_PASSWORD         Passphrase of the signing key

jobs:
  publish-macos:
    name: Publish macOS (jvm jars + darwin JNI artifacts)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rewrite submodule URLs for CI
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Build JNI libraries for all languages (arm64)
        run: |
          tasks=""
          for lang in languages/*/; do
            tasks="$tasks :languages:$(basename "$lang"):buildJni"
          done
          ./gradlew --no-daemon $tasks

      - name: Publish jvm jars and darwin-aarch64 JNI artifacts
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :languages:$lang_name:publishJvmPublicationToMavenCentralRepository"
            tasks="$tasks :jni:$lang_name:publishJniDarwinAarch64PublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash

      - name: Build JNI libraries for all languages (x86_64 cross)
        run: |
          tasks=""
          for lang in languages/*/; do
            tasks="$tasks :languages:$(basename "$lang"):buildJni"
          done
          ./gradlew --no-daemon -Pjni.os=macos -Pjni.arch=x64 $tasks

      - name: Publish darwin-x86_64 JNI artifacts
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :jni:$lang_name:publishJniDarwinX86_64PublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace \
            -Pjni.os=macos -Pjni.arch=x64 \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash

  publish-linux:
    name: Publish Linux (linux JNI artifacts)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rewrite submodule URLs for CI
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Build JNI libraries for all languages (x86_64)
        run: |
          tasks=""
          for lang in languages/*/; do
            tasks="$tasks :languages:$(basename "$lang"):buildJni"
          done
          ./gradlew --no-daemon $tasks

      - name: Publish linux-x86_64 JNI artifacts
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :jni:$lang_name:publishJniLinuxX86_64PublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash

      - name: Build JNI libraries for all languages (aarch64 cross)
        run: |
          tasks=""
          for lang in languages/*/; do
            tasks="$tasks :languages:$(basename "$lang"):buildJni"
          done
          ./gradlew --no-daemon -Pjni.os=linux -Pjni.arch=aarch64 $tasks

      - name: Publish linux-aarch64 JNI artifacts
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :jni:$lang_name:publishJniLinuxAarch64PublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace \
            -Pjni.os=linux -Pjni.arch=aarch64 \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash

  publish-windows:
    name: Publish Windows (windows JNI artifacts)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rewrite submodule URLs for CI
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length

      - name: Build JNI libraries for all languages
        run: |
          tasks=""
          for lang in languages/*/; do
            tasks="$tasks :languages:$(basename "$lang"):buildJni"
          done
          ./gradlew --no-daemon $tasks
        shell: bash

      - name: Publish windows-x86_64 JNI artifacts
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :jni:$lang_name:publishJniWindowsX86_64PublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}