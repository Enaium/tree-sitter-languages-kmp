name: Publish

"on":
  workflow_dispatch:

# Publishes every language's JVM jar, KMP native klibs, android AAR and
# per-platform JNI artifacts to Maven Central. Each publication is produced
# by exactly one runner; the cross-compiled platforms are separate jobs so a
# failure in one never blocks the others and every build finishes
# successfully (the automatic release only runs on successful builds):
#
#   publish-macos       -> -kmp-jvm, -kmp metadata (kotlinMultiplatform),
#                          Apple native klibs (macosArm64/macosX64/iosArm64/
#                          iosSimulatorArm64) and -kmp-jni-darwin-aarch64
#   publish-darwin-x64  -> -kmp-jni-darwin-x86_64 (cross-compiled with
#                          -Pjni.os=macos -Pjni.arch=x64)
#   publish-linux       -> linuxX64/linuxArm64/mingwX64 native klibs, the
#                          android AAR and -kmp-jni-linux-x86_64
#   publish-linux-arm64 -> -kmp-jni-linux-aarch64 (cross-compiled with
#                          -Pjni.os=linux -Pjni.arch=aarch64)
#   publish-windows     -> -kmp-jni-windows-x86_64 (native MinGW/CMake build)
#
# The per-publication ...ToMavenCentralRepository tasks upload each
# publication; with automaticRelease = true the maven-central build service
# publishes the deployment at the end of the build.
#
# The jvm POM of each language lists all five JNI artifacts as runtime
# dependencies, so all of them must be published before consumers can resolve
# the language artifact.
#
# Trigger: run manually via the Actions tab. Versions are the grammar tags
# of each language plus a .1 release suffix (e.g. tree-sitter-java v0.23.5
# -> 0.23.5.1), resolved from the submodules at build time.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MAVEN_CENTRAL_USERNAME   Sonatype Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD   Sonatype Central Portal user-token password
#   SIGNING_KEY              base64-encoded PGP secret key ring (.gpg, binary)
#   SIGNING_KEY_ID           8-hex-digit key id (without the 0x prefix)
#   SIGNING_PASSWORD         Passphrase of the signing key

jobs:
  publish-macos:
    name: Publish macOS (jvm jars + darwin JNI artifacts)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rewrite submodule URLs for CI
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Build JNI libraries for all languages (arm64)
        run: |
          tasks=""
          for lang in languages/*/; do
            tasks="$tasks :languages:$(basename "$lang"):buildJni"
          done
          ./gradlew --no-daemon $tasks

      # Already-published coordinates (e.g. re-running a partially published
      # version) make these steps fail with 'component already exists';
      # continue-on-error keeps the remaining publications reachable. A
      # Gradle build that fails does not trigger the automatic Central
      # release, so the required artifacts are published in their own steps.
      - name: Publish jvm jars (tolerate already-published)
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :languages:$lang_name:publishJvmPublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash

      - name: Publish KMP metadata and Apple native klibs
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :languages:$lang_name:publishKotlinMultiplatformPublicationToMavenCentralRepository"
            tasks="$tasks :languages:$lang_name:publishMacosArm64PublicationToMavenCentralRepository"
            tasks="$tasks :languages:$lang_name:publishMacosX64PublicationToMavenCentralRepository"
            tasks="$tasks :languages:$lang_name:publishIosArm64PublicationToMavenCentralRepository"
            tasks="$tasks :languages:$lang_name:publishIosSimulatorArm64PublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash

      - name: Publish darwin-aarch64 JNI artifacts (tolerate already-published)
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :jni:$lang_name-darwin-aarch64:publishMavenPublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash

  publish-darwin-x64:
    name: Publish darwin-x86_64 JNI artifacts
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rewrite submodule URLs for CI
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Build JNI libraries for all languages (x86_64 cross)
        run: |
          tasks=""
          for lang in languages/*/; do
            tasks="$tasks :languages:$(basename "$lang"):buildJni"
          done
          ./gradlew --no-daemon -Pjni.os=macos -Pjni.arch=x64 $tasks

      - name: Publish darwin-x86_64 JNI artifacts (tolerate already-published)
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :jni:$lang_name-darwin-x86_64:publishMavenPublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace \
            -Pjni.os=macos -Pjni.arch=x64 \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash

  publish-linux:
    name: Publish Linux (linux JNI artifacts)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rewrite submodule URLs for CI
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Install Android NDK
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "platforms;android-36" >/dev/null

      - name: Build JNI libraries for all languages (x86_64)
        run: |
          tasks=""
          for lang in languages/*/; do
            tasks="$tasks :languages:$(basename "$lang"):buildJni"
          done
          ./gradlew --no-daemon $tasks

      - name: Publish native klibs (linux/mingw) and the android AAR
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :languages:$lang_name:publishLinuxX64PublicationToMavenCentralRepository"
            tasks="$tasks :languages:$lang_name:publishLinuxArm64PublicationToMavenCentralRepository"
            tasks="$tasks :languages:$lang_name:publishMingwX64PublicationToMavenCentralRepository"
            tasks="$tasks :languages:$lang_name:publishAndroidPublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash

      - name: Publish linux-x86_64 JNI artifacts (tolerate already-published)
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :jni:$lang_name-linux-x86_64:publishMavenPublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash

  publish-linux-arm64:
    name: Publish linux-aarch64 JNI artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rewrite submodule URLs for CI
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Build JNI libraries for all languages (aarch64 cross)
        run: |
          tasks=""
          for lang in languages/*/; do
            tasks="$tasks :languages:$(basename "$lang"):buildJni"
          done
          ./gradlew --no-daemon -Pjni.os=linux -Pjni.arch=aarch64 $tasks

      - name: Publish linux-aarch64 JNI artifacts (tolerate already-published)
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :jni:$lang_name-linux-aarch64:publishMavenPublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace \
            -Pjni.os=linux -Pjni.arch=aarch64 \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash

  publish-windows:
    name: Publish Windows (windows JNI artifacts)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rewrite submodule URLs for CI
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length

      - name: Build JNI libraries for all languages
        run: |
          tasks=""
          for lang in languages/*/; do
            tasks="$tasks :languages:$(basename "$lang"):buildJni"
          done
          ./gradlew --no-daemon $tasks
        shell: bash

      - name: Publish windows-x86_64 JNI artifacts (tolerate already-published)
        continue-on-error: true
        run: |
          tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            tasks="$tasks :jni:$lang_name-windows-x86_64:publishMavenPublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace --continue \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            $tasks
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}