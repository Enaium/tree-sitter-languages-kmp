name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Each job builds the JVM JNI library for one platform and publishes the
  # language (JVM) and platform JNI artifacts to Maven Local.
  jvm:
    name: jvm (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            jni-suffix: linux-x86_64
            cross: ""
          - name: linux-arm64
            os: ubuntu-24.04
            jni-suffix: linux-aarch64
            cross: linux
          - name: windows-x64
            os: windows-2022
            jni-suffix: windows-x86_64
            cross: ""
          - name: macos-arm64
            os: macos-14
            jni-suffix: darwin-aarch64
            cross: ""
          - name: macos-x64
            os: macos-14
            jni-suffix: darwin-x86_64
            cross: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Submodules are pinned with SSH URLs; rewrite to HTTPS for CI.
      - name: Rewrite submodule URLs for CI
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install cross toolchain (linux-aarch64)
        if: matrix.cross == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      # The Windows runner needs the key decoded with PowerShell: bash is not
      # the default shell there and GitHub's $RUNNER_TEMP is a Windows path.
      - name: Decode signing key
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length

      - name: Decode signing key
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
      - name: Build JNI libraries and publish to Maven Local
        run: |
          cross_args=""
          if [[ "${{ matrix.cross }}" == "linux" ]]; then
            cross_args="-Pjni.os=linux -Pjni.arch=aarch64"
          elif [[ "${{ matrix.cross }}" == "macos" ]]; then
            cross_args="-Pjni.os=macos -Pjni.arch=x64"
          fi
          signing_args="-Psigning.keyId=${{ secrets.SIGNING_KEY_ID }} -Psigning.secretKeyRingFile=$RUNNER_TEMP/signing-key.gpg -Psigning.password=${{ secrets.SIGNING_PASSWORD }}"
          tasks=""
          for lang in languages/*/; do
            tasks="$tasks :languages:$(basename "$lang"):buildJni"
          done
          ./gradlew --no-daemon $signing_args $cross_args $tasks
          publish_tasks=""
          for lang in languages/*/; do
            lang_name="$(basename "$lang")"
            publish_tasks="$publish_tasks :languages:$lang_name:publishJvmPublicationToMavenLocal"
            publish_tasks="$publish_tasks :jni:$lang_name-${{ matrix.jni-suffix }}:publishToMavenLocal"
          done
          ./gradlew --no-daemon $signing_args $cross_args $publish_tasks
        shell: bash
      - name: Verify JNI artifact embeds the native library
        run: |
          echo "=== jni-libs diagnostics ==="
          ls -la languages/agda/build/jni-libs/lib/ 2>&1 | head -10
          ls -la languages/agda/build/jni-libs/lib/windows/ 2>&1 | head -10
          ls -la languages/agda/build/jni-libs/lib/windows/x64/ 2>&1 | head -10
          python3 - "${{ matrix.jni-suffix }}" <<'EOF'
          import glob, os, re, sys, zipfile
          suffix = sys.argv[1]
          home = os.path.expanduser("~")
          repo = os.path.join(home, ".m2", "repository", "cn", "enaium", "treesitter")
          failed = False
          for lang in sorted(os.listdir(os.path.join(os.getcwd(), "languages"))):
              d = os.path.join(repo, f"treesitter-languages-{lang}-kmp-jni-{suffix}")
              jars = [f for f in glob.glob(os.path.join(d, "*", "*.jar"))
                      if not f.endswith("-sources.jar") and not f.endswith("-javadoc.jar")]
              if not jars:
                  print(f"{lang}: NO JAR"); failed = True; continue
              pat = re.compile(rf"lib/.*/lib?ktreesitter-{re.escape(lang)}\.(so|dylib|dll)")
              found = [n for n in zipfile.ZipFile(jars[0]).namelist() if pat.search(n)]
              print(f"{lang}: {len(found)} native entry/ies in {os.path.basename(jars[0])}")
              if not found:
                  failed = True
          if failed:
              print("ERROR: at least one JNI jar is missing its native library")
              sys.exit(1)
          EOF
        shell: bash
